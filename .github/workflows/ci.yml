name: Inventory quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14'
      - name: Prepare pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Static analysis and lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Build and Rust tests
        run: |
          cargo build --workspace --locked
          cargo test --workspace --locked
      - name: Contracts, negative cases and local integration
        run: |
          python -m pip install -r tests/requirements.txt
          python -m unittest discover -s tests/contracts -v
          mkdir -p reports
          target/debug/lgi-agent > reports/inventory-ci.json
          python scripts/validate_inventory.py reports/inventory-ci.json
      - name: Portable laboratory build and contract checks
        run: |
          rustup target add x86_64-unknown-linux-musl --toolchain 1.84.1
          cargo build --release --locked --target x86_64-unknown-linux-musl
          readelf -l target/x86_64-unknown-linux-musl/release/lgi-agent > reports/agent-program-headers.txt
          if grep -q INTERP reports/agent-program-headers.txt; then
            echo "Portable artifact unexpectedly requires a dynamic interpreter"
            exit 1
          fi
          LGI_AGENT_BIN=target/x86_64-unknown-linux-musl/release/lgi-agent python -m unittest discover -s tests/contracts -v
      - name: Rust and Python dependencies (OSV)
        run: python scripts/audit_dependencies.py
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: 8.24.2
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'
          GITLEAKS_ENABLE_SUMMARY: 'true'
